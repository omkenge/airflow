ackfill-line-4"><rect width="1464" height="24.65" x="0" y="99.1"/></clipPath><clipPath id="breeze-registry-backfill-line-5"><rect width="1464" height="24.65" x="0" y="123.5"/></clipPath><clipPath id="breeze-registry-backfill-line-6"><rect width="1464" height="24.65" x="0" y="147.9"/></clipPath><clipPath id="breeze-registry-backfill-line-7"><rect width="1464" height="24.65" x="0" y="172.3"/></clipPath><clipPath id="breeze-registry-backfill-line-8"><rect width="1464" height="24.65" x="0" y="196.7"/></clipPath><clipPath id="breeze-registry-backfill-line-9"><rect width="1464" height="24.65" x="0" y="221.1"/></clipPath><clipPath id="breeze-registry-backfill-line-10"><rect width="1464" height="24.65" x="0" y="245.5"/></clipPath><clipPath id="breeze-registry-backfill-line-11"><rect width="1464" height="24.65" x="0" y="269.9"/></clipPath><clipPath id="breeze-registry-backfill-line-12"><rect width="1464" height="24.65" x="0" y="294.3"/></clipPath><clipPath id="breeze-registry-backfill-line-13"><rect width="1464" height="24.65" x="0" y="318.7"/></clipPath><clipPath id="breeze-registry-backfill-line-14"><rect width="1464" height="24.65" x="0" y="343.1"/></clipPath><clipPath id="breeze-registry-backfill-line-15"><rect width="1464" height="24.65" x="0" y="367.5"/></clipPath></defs><rect width="1480" height="462.8" x="1" y="1" fill="#292929" stroke="rgba(255,255,255,0.35)" stroke-width="1" rx="8"/><text x="740" y="27" fill="#c5c8c6" class="breeze-registry-backfill-title" text-anchor="middle">Command: registry backfill</text><g transform="translate(26,22)"><circle cx="0" cy="0" r="7" fill="#ff5f57"/><circle cx="22" cy="0" r="7" fill="#febc2e"/><circle cx="44" cy="0" r="7" fill="#28c840"/></g><g clip-path="url(#breeze-registry-backfill-clip-terminal)" transform="translate(9, 41)"><g class="breeze-registry-backfill-matrix"><text x="12.2" y="44.4" class="breeze-registry-backfill-r2" clip-path="url(#breeze-registry-backfill-line-1)" textLength="73.2">Usage:</text><text x="97.6" y="44.4" class="breeze-registry-backfill-r3" clip-path="url(#breeze-registry-backfill-line-1)" textLength="292.8">breeze registry backfill</text><text x="402.6" y="44.4" class="breeze-registry-backfill-r1" clip-path="url(#breeze-registry-backfill-line-1)" textLength="12.2">[</text><text x="414.8" y="44.4" class="breeze-registry-backfill-r4" clip-path="url(#breeze-registry-backfill-line-1)" textLength="85.4">OPTIONS</text><text x="500.2" y="44.4" class="breeze-registry-backfill-r1" clip-path="url(#breeze-registry-backfill-line-1)" textLength="12.2">]</text><text x="12.2" y="93.2" class="breeze-registry-backfill-r1" clip-path="url(#breeze-registry-backfill-line-3)" textLength="1427.4">Extract metadata, parameters, and connections for older provider versions. Runs extract_versions.py (host, git tags)</text><text x="12.2" y="117.6" class="breeze-registry-backfill-r1" clip-path="url(#breeze-registry-backfill-line-4)" textLength="1012.6">for metadata.json, then extract_parameters.py + extract_connections.py via &apos;uv run</text><text x="1024.8" y="117.6" class="breeze-registry-backfill-r4" clip-path="url(#breeze-registry-backfill-line-4)" textLength="73.2">--with</text><text x="1098" y="117.6" class="breeze-registry-backfill-r1" clip-path="url(#breeze-registry-backfill-line-4)" textLength="317.2">&apos;. No Docker needed. Each</text><text x="12.2" y="142" class="breeze-registry-backfill-r1" clip-path="url(#breeze-registry-backfill-line-5)" textLength="1134.6">version uses an isolated providers.json, so multiple providers can be backfilled in parallel.</text><text x="0" y="190.8" class="breeze-registry-backfill-r5" clip-path="url(#breeze-registry-backfill-line-7)" textLength="24.4">╭─</text><text x="24.4" y="190.8" class="breeze-registry-backfill-r5" clip-path="url(#breeze-registry-backfill-line-7)" textLength="195.2">Backfill flags</text><text x="219.6" y="190.8" class="breeze-registry-backfill-r5" clip-path="url(#breeze-registry-backfill-line-7)" textLength="1220">────────────────────────────────────────────────────────────────────────────────────────────────────</text><text x="1439.6" y="190.8" class="breeze-registry-backfill-r5" clip-path="url(#breeze-registry-backfill-line-7)" textLength="24.4">─╮</text><text x="0" y="215.2" class="breeze-registry-backfill-r5" clip-path="url(#breeze-registry-backfill-line-8)" textLength="12.2">│</text><text x="24.4" y="215.2" class="breeze-registry-backfill-r6" clip-path="url(#breeze-registry-backfill-line-8)" textLength="12.2">*</text><text x="61" y="215.2" class="breeze-registry-backfill-r4" clip-path="url(#breeze-registry-backfill-line-8)" textLength="122">--provider</text><text x="207.4" y="215.2" class="breeze-registry-backfill-r1" clip-path="url(#breeze-registry-backfill-line-8)" textLength="707.6">Provider ID (e.g. &apos;amazon&apos;, &apos;google&apos;, &apos;microsoft-azure&apos;).</text><text x="915" y="215.2" class="breeze-registry-backfill-r7" clip-path="url(#breeze-registry-backfill-line-8)" textLength="122">[required]</text><text x="1049.2" y="215.2" class="breeze-registry-backfill-r8" clip-path="url(#breeze-registry-backfill-line-8)" textLength="73.2">(TEXT)</text><text x="1451.8" y="215.2" class="breeze-registry-backfill-r5" clip-path="url(#breeze-registry-backfill-line-8)" textLength="12.2">│</text><text x="0" y="239.6" class="breeze-registry-backfill-r5" clip-path="url(#breeze-registry-backfill-line-9)" textLength="12.2">│</text><text x="24.4" y="239.6" class="breeze-registry-backfill-r6" clip-path="url(#breeze-registry-backfill-line-9)" textLength="12.2">*</text><text x="61" y="239.6" class="breeze-registry-backfill-r4" clip-path="url(#breeze-registry-backfill-line-9)" textLength="122">--version</text><text x="207.4" y="239.6" class="breeze-registry-backfill-r1" clip-path="url(#breeze-registry-backfill-line-9)" textLength="683.2">Version(s) to extract. Can be specified multiple times:</text><text x="890.6" y="239.6" class="breeze-registry-backfill-r4" clip-path="url(#breeze-registry-backfill-line-9)" textLength="109.8">--version</text><text x="1000.4" y="239.6" class="breeze-registry-backfill-r1" clip-path="url(#breeze-registry-backfill-line-9)" textLength="97.6">9.21.0</text><text x="1098" y="239.6" class="breeze-registry-backfill-r4" clip-path="url(#breeze-registry-backfill-line-9)" textLength="109.8">--version</text><text x="1207.8" y="239.6" class="breeze-registry-backfill-r1" clip-path="url(#breeze-registry-backfill-line-9)" textLength="97.6">9.20.0</text><text x="1305.4" y="239.6" class="breeze-registry-backfill-r7" clip-path="url(#breeze-registry-backfill-line-9)" textLength="122">[required]</text><text x="1451.8" y="239.6" class="breeze-registry-backfill-r5" clip-path="url(#breeze-registry-backfill-line-9)" textLength="12.2">│</text><text x="0" y="264" class="breeze-registry-backfill-r5" clip-path="url(#breeze-registry-backfill-line-10)" textLength="12.2">│</text><text x="207.4" y="264" class="breeze-registry-backfill-r8" clip-path="url(#breeze-registry-backfill-line-10)" textLength="73.2">(TEXT)</text><text x="1451.8" y="264" class="breeze-registry-backfill-r5" clip-path="url(#breeze-registry-backfill-line-10)" textLength="12.2">│</text><text x="0" y="288.4" class="breeze-registry-backfill-r5" clip-path="url(#breeze-registry-backfill-line-11)" textLength="1464">╰──────────────────────────────────────────────────────────────────────────────────────────────────────────────────────╯</text><text x="0" y="312.8" class="breeze-registry-backfill-r5" clip-path="url(#breeze-registry-backfill-line-12)" textLength="24.4">╭─</text><text x="24.4" y="312.8" class="breeze-registry-backfill-r5" clip-path="url(#breeze-registry-backfill-line-12)" textLength="195.2">Common options</text><text x="219.6" y="312.8" class="breeze-registry-backfill-r5" clip-path="url(#breeze-registry-backfill-line-12)" textLength="1220">────────────────────────────────────────────────────────────────────────────────────────────────────</text><text x="1439.6" y="312.8" class="breeze-registry-backfill-r5" clip-path="url(#breeze-registry-backfill-line-12)" textLength="24.4">─╮</text><text x="0" y="337.2" class="breeze-registry-backfill-r5" clip-path="url(#breeze-registry-backfill-line-13)" textLength="12.2">│</text><text x="24.4" y="337.2" class="breeze-registry-backfill-r4" clip-path="url(#breeze-registry-backfill-line-13)" textLength="109.8">--verbose</text><text x="158.6" y="337.2" class="breeze-registry-backfill-r9" clip-path="url(#breeze-registry-backfill-line-13)" textLength="24.4">-v</text><text x="207.4" y="337.2" class="breeze-registry-backfill-r1" clip-path="url(#breeze-registry-backfill-line-13)" textLength="585.6">Print verbose information about performed steps.</text><text x="1451.8" y="337.2" class="breeze-registry-backfill-r5" clip-path="url(#breeze-registry-backfill-line-13)" textLength="12.2">│</text><text x="0" y="361.6" class="breeze-registry-backfill-r5" clip-path="url(#breeze-registry-backfill-line-14)" textLength="12.2">│</text><text x="24.4" y="361.6" class="breeze-registry-backfill-r4" clip-path="url(#breeze-registry-backfill-line-14)" textLength="109.8">--dry-run</text><text x="158.6" y="361.6" class="breeze-registry-backfill-r9" clip-path="url(#breeze-registry-backfill-line-14)" textLength="24.4">-D</text><text x="207.4" y="361.6" class="breeze-registry-backfill-r1" clip-path="url(#breeze-registry-backfill-line-14)" textLength="719.8">If dry-run is set, commands are only printed, not executed.</text><text x="1451.8" y="361.6" class="breeze-registry-backfill-r5" clip-path="url(#breeze-registry-backfill-line-14)" textLength="12.2">│</text><text x="0" y="386" class="breeze-registry-backfill-r5" clip-path="url(#breeze-registry-backfill-line-15)" textLength="12.2">│</text><text x="24.4" y="386" class="breeze-registry-backfill-r4" clip-path="url(#breeze-registry-backfill-line-15)" textLength="109.8">--help</text><text x="158.6" y="386" class="breeze-registry-backfill-r9" clip-path="url(#breeze-registry-backfill-line-15)" textLength="24.4">-h</text><text x="207.4" y="386" class="breeze-registry-backfill-r1" clip-path="url(#breeze-registry-backfill-line-15)" textLength="329.4">Show this message and exit.</text><text x="1451.8" y="386" class="breeze-registry-backfill-r5" clip-path="url(#breeze-registry-backfill-line-15)" textLength="12.2">│</text><text x="0" y="410.4" class="breeze-registry-backfill-r5" clip-path="url(#breeze-registry-backfill-line-16)" textLength="1464">╰──────────────────────────────────────────────────────────────────────────────────────────────────────────────────────╯</text></g></g></svg>